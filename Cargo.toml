[workspace.package]
name = "dbc-coinflip"
edition = "2021"
repository = "https://github.com/M-Daeva/dbc-coinflip"
authors = []
license = "BSL-1.1"

[workspace]
members = ["programs/*", "packages/*"]
exclude = []
resolver = "2"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = "fat"
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[workspace.dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "memo"] }
borsh = "0.10.4"
uint = { version = "0.10.0", default-features = false }
solana-program = "2.2.1"
# dynamic-bonding-curve = { git = "https://github.com/MeteoraAg/dynamic-bonding-curve", package = "dynamic-bonding-curve", features = [
#   "cpi",
# ] }
orao-solana-vrf = { version = "0.6.1", default-features = false, features = [
  "cpi",
] }

base = { path = "./packages/base" }
coinflip-api = { path = "./packages/coinflip-api" }

coinflip = { path = "./programs/coinflip" }
